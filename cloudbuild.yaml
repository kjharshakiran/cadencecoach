# Cloud Build configuration for Spartan Coach
# This file automates the build and deployment to Cloud Run

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/spartan-coach:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/spartan-coach:latest'
      - '.'

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/spartan-coach'

  # Deploy to Cloud Run with Cloud SQL connection
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'spartan-coach'
      - '--image'
      - 'gcr.io/$PROJECT_ID/spartan-coach:$BUILD_ID'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:$_REGION:spartan-coach-db'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,MODEL_PROVIDER=gemini,CLOUD_SQL_CONNECTION_NAME=$PROJECT_ID:$_REGION:spartan-coach-db,DB_USER=spartanapp,DB_PASS=SpartanWarrior2025!,DB_NAME=spartancoach'
      - '--set-secrets'
      - 'GOOGLE_API_KEY=GOOGLE_API_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,SESSION_SECRET=SESSION_SECRET:latest,DEFAULT_USERNAME=DEFAULT_USERNAME:latest,DEFAULT_PASSWORD=DEFAULT_PASSWORD:latest,WHOOP_CLIENT_ID=WHOOP_CLIENT_ID:latest,WHOOP_CLIENT_SECRET=WHOOP_CLIENT_SECRET:latest,WHOOP_REDIRECT_URI=WHOOP_REDIRECT_URI:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,TWILIO_WHATSAPP_NUMBER=TWILIO_WHATSAPP_NUMBER:latest'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/spartan-coach:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/spartan-coach:latest'

# Build timeout
timeout: '1200s'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
